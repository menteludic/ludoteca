# Production and staging compose. Installed by hand at
# /home/ubuntu/docker/ludoteca/{prod,stg}/compose.yaml and only touched when
# this file changes. A normal deploy only moves TAG in the .env.
#
# Requires ENV_NAME (prod or stg) and TAG in each environment .env file.
# Publishes no ports: the proxy reaches the app over the "proxy" network and
# nothing is exposed on the host (ADR-019). Health is asked with
# `docker compose exec`.
name: ludoteca-${ENV_NAME:?define ENV_NAME en .env}

services:
  app:
    image: ghcr.io/menteludic/ludoteca:${TAG:?TAG no definido en el .env}
    container_name: ludoteca-${ENV_NAME:?define ENV_NAME en .env}-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_VERSION: ${TAG}
    volumes:
      - ./data:/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "src/cli.js", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    external: true