name: ci

# Pruebas en cada rama y PR; imagen y despliegue solo cuando el código entra en main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/menteludic/ludoteca

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Audit de dependencias
        run: npm audit --audit-level=high
      - name: Gate del despliegue
        run: sh deploy/gate-selftest.sh
      - name: Material de clave privada
        run: |
          # El propio workflow nombra el marcador que busca, así que se excluye.
          hits=$(grep -rIlE -e '-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----' \
            --include='*.js' --include='*.json' --include='*.yml' --include='*.md' \
            --exclude-dir=.github --exclude-dir=node_modules . || true)
          if [ -n "$hits" ]; then
            echo "Clave privada en:"
            echo "$hits"
            exit 1
          fi

  image:
    name: image
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-staging:
    name: deploy-staging
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Clave de despliegue y host conocido
        env:
          # Fingerprint de la clave ed25519 del servidor. Una clave pública no es
          # un secreto: fijarla aquí evita depender de que el secret esté pegado
          # con el formato exacto de known_hosts.
          EXPECTED: SHA256:LFucYCBmSCyjI1mNf/QpVjVhqlAlCwRCB5Jau1j6n38
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/id_deploy ||
            { echo "SSH_KEY no contiene una clave privada OpenSSH"; exit 1; }
          ssh-keyscan -t ed25519 "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] ||
            { echo "no se pudo leer la clave del host ${{ secrets.SSH_HOST }}"; exit 1; }
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | head -1)
          [ "$actual" = "$EXPECTED" ] ||
            { echo "clave del host inesperada: $actual (se esperaba $EXPECTED)"; exit 1; }
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_USER }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Desplegar en staging
        run: |
          set +e
          out=$(ssh vps "deploy stg ${{ needs.image.outputs.tag }}" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" > "$RUNNER_TEMP/deploy.log"
          exit $rc
      - name: Comprobar por HTTPS
        run: |
          AUTH="${{ secrets.STG_BASIC_AUTH }}"
          if [ -n "$AUTH" ]; then set -- -u "$AUTH"; else set --; fi
          body=$(curl -fsS "$@" "https://ludoteca-stg.floyd303.com/health")
          echo "$body"
          echo "$body" | grep -q "\"version\":\"${{ needs.image.outputs.tag }}\""
      - name: Publicar el fallo en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          {
            echo "El despliegue en **staging** falló con la etiqueta \`$TAG\`."
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/deploy.log" 2>/dev/null || echo "sin salida capturada"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Despliegue en staging falló ($TAG)" \
            --body-file "$RUNNER_TEMP/body.md"

  deploy-production:
    name: deploy-production
    needs: [image, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Clave de despliegue y host conocido
        env:
          # Fingerprint de la clave ed25519 del servidor. Una clave pública no es
          # un secreto: fijarla aquí evita depender de que el secret esté pegado
          # con el formato exacto de known_hosts.
          EXPECTED: SHA256:LFucYCBmSCyjI1mNf/QpVjVhqlAlCwRCB5Jau1j6n38
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/id_deploy ||
            { echo "SSH_KEY no contiene una clave privada OpenSSH"; exit 1; }
          ssh-keyscan -t ed25519 "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] ||
            { echo "no se pudo leer la clave del host ${{ secrets.SSH_HOST }}"; exit 1; }
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | head -1)
          [ "$actual" = "$EXPECTED" ] ||
            { echo "clave del host inesperada: $actual (se esperaba $EXPECTED)"; exit 1; }
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_USER }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Desplegar en producción
        run: |
          set +e
          out=$(ssh vps "deploy prod ${{ needs.image.outputs.tag }}" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" > "$RUNNER_TEMP/deploy.log"
          exit $rc
      - name: Comprobar por HTTPS
        run: |
          body=$(curl -fsS "https://ludoteca.floyd303.com/health")
          echo "$body"
          echo "$body" | grep -q "\"version\":\"${{ needs.image.outputs.tag }}\""
      - name: Publicar el fallo en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          {
            echo "El despliegue en **producción** falló con la etiqueta \`$TAG\`."
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/deploy.log" 2>/dev/null || echo "sin salida capturada"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Despliegue en producción falló ($TAG)" \
            --body-file "$RUNNER_TEMP/body.md"