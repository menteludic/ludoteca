name: ci

# Tests on every branch and pull request; image and deploy only when code lands in main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/menteludic/ludoteca

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Gate del despliegue
        run: sh deploy/gate-selftest.sh
      - name: Private key material
        run: |
          # The workflow itself names the marker it looks for, so it is excluded.
          hits=$(grep -rIlE -e '-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----' \
            --include='*.js' --include='*.json' --include='*.yml' --include='*.md' \
            --exclude-dir=.github --exclude-dir=node_modules . || true)
          if [ -n "$hits" ]; then
            echo "Private key found in:"
            echo "$hits"
            exit 1
          fi

  image:
    name: image
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-staging:
    name: deploy-staging
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        # Another job's output does not survive a re-run of failed jobs, so the
        # tag is computed here from the commit being deployed.
        run: echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Deploy key and known host
        env:
          # Fingerprint of the server ed25519 key. A public key is not a
          # secret: pinning it here removes the dependency on the secret being
          # pasted in the exact known_hosts shape.
          EXPECTED: SHA256:LFucYCBmSCyjI1mNf/QpVjVhqlAlCwRCB5Jau1j6n38
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/id_deploy ||
            { echo "SSH_KEY does not hold an OpenSSH private key"; exit 1; }
          ssh-keyscan -t ed25519 "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] ||
            { echo "could not read the host key of ${{ secrets.SSH_HOST }}"; exit 1; }
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | head -1)
          [ "$actual" = "$EXPECTED" ] ||
            { echo "unexpected host key: $actual (expected $EXPECTED)"; exit 1; }
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_USER }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Deploy to staging
        run: |
          set +e
          out=$(ssh vps "deploy stg ${{ steps.tag.outputs.tag }}" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" > "$RUNNER_TEMP/deploy.log"
          exit $rc
      - name: Check over HTTPS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RAW_AUTH: ${{ secrets.STG_BASIC_AUTH }}
        run: |
          # A secret pasted from a file carries a trailing newline, and curl
          # then rejects the credentials as a malformed URL.
          AUTH=$(printf '%s' "$RAW_AUTH" | tr -d '\r\n')
          if [ -n "$AUTH" ]; then set -- -u "$AUTH"; else set --; fi
          set +e
          raw=$(curl -sS -o "$RUNNER_TEMP/body.json" -w '%{http_code}' "$@" \
            "https://ludoteca-stg.floyd303.com/health" 2>&1)
          curl_rc=$?
          set -e
          code=$(printf '%s' "$raw" | tail -1)
          # The record also goes to the file that ends up in the issue: without
          # it the failure stays in a log that needs a GitHub session to read.
          {
            echo "staging check: curl exit $curl_rc, http $code"
            printf '%s\n' "$raw" | head -5
            cat "$RUNNER_TEMP/body.json" 2>/dev/null
            echo
            case "$code" in
              401|403) echo "staging requires authentication: check the STG_BASIC_AUTH secret (user:password without spaces)" ;;
              200) ;;
              *) echo "unexpected answer from staging: $code" ;;
            esac
            grep -q "version\":\"$TAG" "$RUNNER_TEMP/body.json" ||
              echo "the served version is not $TAG"
          } | tee -a "$RUNNER_TEMP/deploy.log"
          [ "$code" = "200" ] || exit 1
          grep -q "version\":\"$TAG" "$RUNNER_TEMP/body.json"
      - name: Publish the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "The staging deploy failed with tag \`$TAG\`."
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/deploy.log" 2>/dev/null || echo "no output captured"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Staging deploy failed ($TAG)" \
            --body-file "$RUNNER_TEMP/body.md"

  deploy-production:
    name: deploy-production
    needs: [image, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        # Another job's output does not survive a re-run of failed jobs, so the
        # tag is computed here from the commit being deployed.
        run: echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Deploy key and known host
        env:
          # Fingerprint of the server ed25519 key. A public key is not a
          # secret: pinning it here removes the dependency on the secret being
          # pasted in the exact known_hosts shape.
          EXPECTED: SHA256:LFucYCBmSCyjI1mNf/QpVjVhqlAlCwRCB5Jau1j6n38
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/id_deploy ||
            { echo "SSH_KEY does not hold an OpenSSH private key"; exit 1; }
          ssh-keyscan -t ed25519 "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] ||
            { echo "could not read the host key of ${{ secrets.SSH_HOST }}"; exit 1; }
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | head -1)
          [ "$actual" = "$EXPECTED" ] ||
            { echo "unexpected host key: $actual (expected $EXPECTED)"; exit 1; }
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_USER }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Deploy to production
        run: |
          set +e
          out=$(ssh vps "deploy prod ${{ steps.tag.outputs.tag }}" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" > "$RUNNER_TEMP/deploy.log"
          exit $rc
      - name: Check over HTTPS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/body.json" -w '%{http_code}' \
            "https://ludoteca.floyd303.com/health")
          {
            echo "production check: http $code"
            cat "$RUNNER_TEMP/body.json" 2>/dev/null
            echo
            grep -q "version\":\"$TAG" "$RUNNER_TEMP/body.json" ||
              echo "the served version is not $TAG"
          } | tee -a "$RUNNER_TEMP/deploy.log"
          [ "$code" = "200" ] || exit 1
          grep -q "version\":\"$TAG" "$RUNNER_TEMP/body.json"
      - name: Publish the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "The production deploy failed with tag \`$TAG\`."
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/deploy.log" 2>/dev/null || echo "no output captured"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Production deploy failed ($TAG)" \
            --body-file "$RUNNER_TEMP/body.md"
